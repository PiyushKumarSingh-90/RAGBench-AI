name: CI

# Runs on every push and pull request. No API keys and no LLM calls:
# - checks: lint, formatting, benchmark dataset validation, unit tests
# - retrieval-regression: rebuilds the indexes and fails if retrieval quality
#   drops below evaluation/regression_baseline.json (offline extractive generator)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Validate benchmark questions
        run: |
          for f in evaluation/datasets/{python,scikit_learn,docker,fastapi,aws}_questions.jsonl; do
            python scripts/validate_questions.py "$f"
          done
          python scripts/validate_questions.py --combined evaluation/datasets/benchmark_questions.jsonl
      - name: Unit tests
        run: pytest -q

  retrieval-regression:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/ragbench/retrieval.py', 'src/ragbench/embeddings.py') }}
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Build indexes
        run: |
          python scripts/build_index.py --chunking fixed
          python scripts/build_index.py --chunking semantic
      - name: Run all four strategies (extractive, offline)
        run: python scripts/run_strategies.py --out ci_results --force
      - name: Compare with baseline
        run: python scripts/check_regression.py ci_results | tee regression.txt
      - name: API tests against the built indexes
        run: pytest -q tests/test_api.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-regression
          path: |
            ci_results/comparison.md
            regression.txt
