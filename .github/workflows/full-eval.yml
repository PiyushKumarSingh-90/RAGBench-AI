name: Full LLM evaluation

# Manual only: calls the Groq API (uses the free daily token allowance) and then
# grades the answers offline. Needs the repository secret GROQ_API_KEY.
# One full run is about 335k tokens, more than one day of the free tier: a run
# that hits the limit uploads its partial results; re-running continues only
# if those results are restored into results/, so for the free tier running
# locally (see docs/phase7_ci.md) is simpler.

on:
  workflow_dispatch:
    inputs:
      strategies:
        description: "Strategies to run (space-separated)"
        default: "dense_fixed dense_semantic hybrid rerank"

permissions:
  contents: read

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Build indexes
        run: |
          python scripts/build_index.py --chunking fixed
          python scripts/build_index.py --chunking semantic
      - name: Generate answers with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STRATEGIES: ${{ inputs.strategies }}
        run: |
          python scripts/run_strategies.py --generator groq --out eval_run \
            --strategies $STRATEGIES
      - name: Grade answers (offline)
        run: python scripts/evaluate.py --run eval_run --out eval_results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval
          path: |
            eval_run
            eval_results
