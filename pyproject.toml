[project]
name = "ragbench"
version = "0.1.0"
description = "A framework for comparing and evaluating RAG retrieval strategies."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

