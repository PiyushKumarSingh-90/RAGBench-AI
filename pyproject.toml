[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "A framework for comparing and evaluating RAG retrieval strategies."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "sentence-transformers>=3.0",
    "anthropic>=2.0",
    "google-genai>=1.0",
    "groq>=1.0",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
    "httpx>=0.27",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

